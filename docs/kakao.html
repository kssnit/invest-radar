<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1222">
<title>카카오 연결 코드 · 투자 레이더</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<style>
  :root { color-scheme: dark; --bg: #0a1222; --panel: #111c33; --line: #22324f; --ink: #e8eef9; --ink-2: #a9b6cc; --ink-3: #7486a3; --blue: #4c8dff; --good: #3ccf8e; --warn: #ffb547; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 18px; }
  main { width: 100%; max-width: 440px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14px; margin-bottom: 18px; }
  .brand img { width: 28px; height: 28px; border-radius: 50%; }
  h1 { font-size: 22px; line-height: 1.35; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 14px; color: var(--ink-2); }
  .code { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    font: 15px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; word-break: break-all; color: var(--ink);
    user-select: all; -webkit-user-select: all; margin: 4px 0 14px; }
  button { width: 100%; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-weight: 700; font-size: 17px;
    background: var(--blue); color: #fff; cursor: pointer; }
  button:focus-visible { outline: 3px solid #9cc0ff; outline-offset: 2px; }
  button.done { background: var(--good); color: #062014; }
  ol { margin: 18px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14.5px; }
  ol li { margin-bottom: 6px; }
  .err h1 { color: var(--warn); }
  .small { font-size: 13px; color: var(--ink-3); margin-top: 16px; }
</style>
</head>
<body>
<main id="app">
  <div class="brand"><img src="icon-192.png?v=3" alt="">투자 레이더</div>
  <h1>코드를 확인하는 중이에요</h1>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), app = document.getElementById("app");
  var code = q.get("code"), err = q.get("error"), desc = q.get("error_description");
  // 주소창·방문 기록에 코드가 남지 않게 지워요 (화면에만 보여요)
  if (code || err) history.replaceState(null, "", location.pathname);
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var brand = '<div class="brand"><img src="icon-192.png?v=3" alt="">투자 레이더</div>';
  if (code) {
    app.innerHTML = brand +
      "<h1>카카오 연결 코드</h1><p>아래 코드를 복사해서 Termux 화면의 <b>코드:</b> 자리에 붙여 넣으세요.</p>" +
      '<div class="code" id="code">' + esc(code) + "</div>" +
      '<button type="button" id="copy">코드 복사</button>' +
      "<ol><li>Termux로 돌아가요.</li><li>화면을 길게 눌러 <b>Paste</b>(붙여넣기)를 누르고 Enter를 쳐요.</li><li>카카오톡 ‘나와의 채팅’에 연결 완료 메시지가 오면 끝이에요.</li></ol>" +
      '<p class="small">코드는 한 번만, 몇 분 안에 써야 해요. 시간이 지났다면 Termux에서 radar kakao 를 다시 실행하세요.</p>';
    var btn = document.getElementById("copy");
    btn.addEventListener("click", function () {
      function ok() { btn.textContent = "복사했어요 ✓"; btn.className = "done"; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(ok, fallback);
      } else fallback();
      function fallback() {
        var r = document.createRange(); r.selectNodeContents(document.getElementById("code"));
        var s = getSelection(); s.removeAllRanges(); s.addRange(r);
        try { document.execCommand("copy"); ok(); } catch (e) { btn.textContent = "코드를 길게 눌러 복사하세요"; }
      }
    });
  } else if (err) {
    var msg = err === "access_denied" ? "동의를 취소해서 연결하지 않았어요." : (desc || err);
    app.className = "err";
    app.innerHTML = brand + "<h1>카카오 연결이 안 됐어요</h1><p>" + esc(msg) + "</p>" +
      "<p>Termux에서 <b>radar kakao</b> 를 다시 실행하고, ‘카카오톡 메시지 전송’에 동의해 주세요.</p>";
  } else {
    app.innerHTML = brand + "<h1>카카오 연결용 페이지예요</h1><p>Termux에서 <b>radar kakao</b> 를 실행하면 이 페이지로 연결 코드가 와요.</p>";
  }
})();
</script>
</body>
</html>
